wireplumber.components = [
  {
    name = steamos-arm/default-sink-rank.lua, type = script/lua
    provides = hooks.steamos-arm.default-sink-rank
  }
  {
    type = virtual, provides = policy.steamos-arm.default-sink
    wants = [ hooks.steamos-arm.default-sink-rank ]
  }
]

wireplumber.profiles = {
  main = {
    policy.steamos-arm.default-sink = required
  }
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        steamos-arm.sink-rank = 5
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.usb-*"
      }
    ]
    actions = {
      update-props = {
        steamos-arm.sink-rank = 4
      }
    }
  }
]
