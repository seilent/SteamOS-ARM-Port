name: Build sm8250

on:
  push:
    branches: [pocket-micro-2, pm2-draft]
    paths:
      - external-and-mods/**
      - '!external-and-mods/kernel/**'
      - '!external-and-mods/kernel-elden/**'
      - '!external-and-mods/kernel-sm8350/**'
      - '!external-and-mods/kernel-sm8550/**'
      - '!external-and-mods/kernel-sm8650/**'
      - '!external-and-mods/kernel-sm8750/**'
      - '!external-and-mods/kernel-tb321fu/**'
      - sm8250-overlay/**
      - steamos-overlay/**
      - sm8650-overlay/**
      - sm8550-overlay/**
      - dualscreen-overlay/**
      - scripts/**
      - make-steamos-sm8650.sh
      - .github/workflows/build-sm8250.yml
  workflow_dispatch:
    inputs:
      base_tag:
        description: Release tag of the base image
        type: string
        default: v1.3.0
      base_repo:
        description: Repository of the base release
        type: string
        default: hashtagbasit/SteamOS-ARM-Port
      kernel_run_id:
        description: Run whose kernel-sm8250 artifact to use instead of building one
        type: string
        default: ""
      verbose:
        description: Kernel log on the panel at boot
        type: boolean
        default: true
      draft_release:
        description: Publish the image as a draft release
        type: boolean
        default: false
      regression:
        description: Run kernel-regression
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BASE_TAG: ${{ inputs.base_tag || 'v1.3.0' }}
  BASE_REPO: ${{ inputs.base_repo || 'hashtagbasit/SteamOS-ARM-Port' }}
  VERBOSE: ${{ github.event_name == 'workflow_dispatch' && !inputs.verbose && '0' || '1' }}
  KERNEL_RUN_ID: ${{ inputs.kernel_run_id }}
  BASE_SHA: 582538203e09811f8767995f2e4e8118e251796e
  W: /home/runner/work/w
  MOUNT: /home/runner/work
  IMAGE: registry.fedoraproject.org/fedora@sha256:0c6072366ebf8ea1c8c0f3a118aad3e9a9247d3065d499e54d62968f69351966

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      kernel_common: ${{ steps.diff.outputs.kernel_common }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          v=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              files="$(git ls-tree -r --name-only HEAD)"
            else
              files="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            fi
            if grep -q '^external-and-mods/kernel-common/' <<<"$files"; then v=true; fi
          fi
          echo "kernel_common=$v" >>"$GITHUB_OUTPUT"

  kernel:
    if: ${{ inputs.kernel_run_id == '' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check inputs
        run: |
          [[ "$BASE_TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_tag" >&2; exit 1; }
          [[ "$BASE_REPO" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_repo" >&2; exit 1; }
          [[ "$KERNEL_RUN_ID" =~ ^[0-9]*$ ]] || { echo "bad kernel_run_id" >&2; exit 1; }
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Host tools
        run: |
          docker version
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends busybox-static device-tree-compiler
          file -L /bin/busybox | grep -q 'statically linked'
      - name: Armada checkout
        run: |
          source external-and-mods/kernel-sm8250/soc.env
          d="$(dirname "$PWD")/armada-${ARMADA_REF}"
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/seilent/armada "$ARMADA_REF"
          git -C "$d" checkout -q FETCH_HEAD
          test "$(git -C "$d" rev-parse HEAD)" = "$ARMADA_REF"
          n=$(sed 's/#.*//' "$d/packages/kernel/patches/series" | awk 'NF' | wc -l)
          test "$n" -eq 192
          echo "ARMADA_CHECKOUT=$d" >>"$GITHUB_ENV"
      - name: Build
        run: |
          WORK=$W/kernel-sm8250 bash external-and-mods/kernel-common/build-gcc15.sh sm8250 2>&1 | tee "$RUNNER_TEMP/k8250.log"
          test "${PIPESTATUS[0]}" -eq 0
          { echo '### Compiler'; echo '```'; grep -m1 '^gcc ' "$RUNNER_TEMP/k8250.log"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Check build log
        run: |
          L=$RUNNER_TEMP/k8250.log
          n=$(grep '\] patch armada/' "$L" | grep -vc 'armada/dts/' || true)
          test "$n" -eq 192
          want=$(find "$ARMADA_CHECKOUT/packages/kernel/dts" -maxdepth 1 -name '*.patch' | wc -l)
          n=$(grep -c '\] patch armada/dts/' "$L" || true)
          test "$n" -eq "$want"
          n=$(grep -cE 'patch failed|ERROR|hunks$' "$L" || true)
          test "$n" -eq 0
          n=$(grep -c 'append sm8250-ayaneo-pocket-micro2.dts.append' "$L" || true)
          test "$n" -eq 1
          { echo '### Config WARN lines'; echo '```'; grep '\] WARN CONFIG_' "$L" || true; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - name: Check output
        run: |
          o=$W/kernel-sm8250/output/current
          test -s "$o/boot/KERNEL"
          echo "KERNEL size: $(stat -c %s "$o/boot/KERNEL") bytes" >>"$GITHUB_STEP_SUMMARY"
          dtc -q -I dtb -O dts "$o/dtbs/sm8250-ayaneo-pocket-micro2.dtb" >"$RUNNER_TEMP/pm2.dts"
          grep -q 'model = "AYANEO Pocket MICRO 2";' "$RUNNER_TEMP/pm2.dts"
          n=$(grep -cE 'opp-925000000|opp-650000000' "$RUNNER_TEMP/pm2.dts" || true)
          test "$n" -eq 0
          grep -q 'domain-idle-states' "$RUNNER_TEMP/pm2.dts"
          node() { awk -v n="$1 {" 'index($0, n) { f = 1; d = 0 } f { d += gsub(/\{/, "{"); d -= gsub(/\}/, "}"); if (d == 1) print; if (d <= 0) f = 0 }' "$RUNNER_TEMP/pm2.dts"; }
          node displayport-controller@ae90000 | grep -qF 'status = "okay";'
          slpi=$(node remoteproc@5c00000)
          grep -qF 'compatible = "qcom,sm8250-slpi-pas";' <<<"$slpi"
          grep -qF 'status = "okay";' <<<"$slpi"
          grep -qF 'firmware-name = "qcom/sm8250/ayaneo/pocketmicro2/slpi.mdt";' <<<"$slpi"
          ext=$W/kernel-sm8250/linux-7.2.6/external-firmware
          while read -r size f; do
            test "$(stat -c %s "$ext/$f")" -eq "$size"
          done <<'EOF'
          31964 qcom/a650_sqe.fw
          41548 qcom/a650_gmu.bin
          13964 qcom/sm8250/a650_zap.mbn
          15515796 qcom/sm8250/adsp.mbn
          3628672 ath11k/QCA6390/hw2.0/amss.bin
          266684 ath11k/QCA6390/hw2.0/m3.bin
          231980 ath11k/QCA6390/hw2.0/board-2.bin
          210704 qca/htbtfw20.tlv
          5857 qca/htnv20.bin
          EOF
          diff <(tr ' ' '\n' <"$W/kernel-sm8250/extra-firmware.list" | LC_ALL=C sort) - <<'EOF'
          ath11k/QCA6390/hw2.0/amss.bin
          ath11k/QCA6390/hw2.0/board-2.bin
          ath11k/QCA6390/hw2.0/m3.bin
          qca/htbtfw20.tlv
          qca/htnv20.bin
          qcom/a650_gmu.bin
          qcom/a650_sqe.fw
          qcom/sm8250/a650_zap.mbn
          qcom/sm8250/adsp.mbn
          regulatory.db
          regulatory.db.p7s
          EOF
          test -f "$o/firmware/qcom/a650_sqe.fw"
          cfg=("$o"/config-*)
          test "${#cfg[@]}" -eq 1
          diff <(grep -E '^CONFIG_(NTSYNC|ANDROID_BINDERFS|ANDROID_BINDER_DEVICES|HID_STEAM|FTRACE|SYSFB_SIMPLEFB|DRM_SIMPLEDRM|DRM_MSM|DRM_PANEL_AYANEO_AR18|TOUCHSCREEN_ST7123|HID_AYANEO|REGULATOR_QCOM_LCDB|BACKLIGHT_QCOM_WLED|QCOM_Q6V5_PAS|ARM_PSCI_CPUIDLE|TYPEC_DP_ALTMODE|TYPEC_MUX_GPIO_SBU|QCOM_FASTRPC|QRTR)=' "${cfg[0]}" | LC_ALL=C sort) - <<'EOF'
          CONFIG_ANDROID_BINDERFS=y
          CONFIG_ANDROID_BINDER_DEVICES="anbox-binder,anbox-hwbinder,anbox-vndbinder"
          CONFIG_ARM_PSCI_CPUIDLE=y
          CONFIG_BACKLIGHT_QCOM_WLED=y
          CONFIG_DRM_MSM=y
          CONFIG_DRM_PANEL_AYANEO_AR18=y
          CONFIG_DRM_SIMPLEDRM=y
          CONFIG_FTRACE=y
          CONFIG_HID_AYANEO=m
          CONFIG_HID_STEAM=m
          CONFIG_NTSYNC=m
          CONFIG_QCOM_FASTRPC=y
          CONFIG_QCOM_Q6V5_PAS=m
          CONFIG_QRTR=y
          CONFIG_REGULATOR_QCOM_LCDB=y
          CONFIG_SYSFB_SIMPLEFB=y
          CONFIG_TOUCHSCREEN_ST7123=m
          CONFIG_TYPEC_DP_ALTMODE=m
          CONFIG_TYPEC_MUX_GPIO_SBU=m
          EOF
          n=$(grep -cx 'CONFIG_EXTRA_FIRMWARE=""' "${cfg[0]}" || true)
          test "$n" -eq 1
          n=$(grep -c '^CONFIG_DEBUG_INFO_REDUCED=y' "${cfg[0]}" || true)
          test "$n" -eq 0
          n=$(grep -cE '^CONFIG_(DEBUG_INFO_BTF|SCHED_CLASS_EXT)=y' "${cfg[0]}" || true)
          test "$n" -eq 2
      - name: Pack
        run: |
          out=$W/kernel-sm8250/output
          sudo tar -C "$out" -cf "$RUNNER_TEMP/kernel-sm8250.tar" "$(readlink "$out/current")" current
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-sm8250
          path: ${{ runner.temp }}/kernel-sm8250.tar
          retention-days: 7
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-sm8250-log
          path: ${{ runner.temp }}/k8250.log
          retention-days: 7

  kernel-regression:
    needs: changes
    if: ${{ inputs.regression || needs.changes.outputs.kernel_common == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Check inputs
        run: |
          [[ "$BASE_TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_tag" >&2; exit 1; }
          [[ "$BASE_REPO" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_repo" >&2; exit 1; }
          [[ "$KERNEL_RUN_ID" =~ ^[0-9]*$ ]] || { echo "bad kernel_run_id" >&2; exit 1; }
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Host tools
        run: |
          docker version
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends busybox-static
          file -L /bin/busybox | grep -q 'statically linked'
      - name: Sources
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          mkdir -p "$W"
          git worktree add -q --detach "$W/port-base" "$BASE_SHA"
          source external-and-mods/kernel-sm8650/soc.env
          r=$W/rocknix-${ROCKNIX_REF}
          git clone -q --depth 1 --branch "$ROCKNIX_REF" --filter=blob:none --sparse https://github.com/ROCKNIX/distribution "$r"
          read -ra dirs <<<"$PATCH_DIRS"
          git -C "$r" sparse-checkout set "${dirs[@]}" "projects/ROCKNIX/devices/${ROCKNIX_DEVICE}"
          echo "ROCKNIX_DIR=$r" >>"$GITHUB_ENV"
      - name: Build sm8650 at base and head
        run: |
          manifest() {
            local o=$W/reg/output/current
            echo '## config'
            grep -v '^#' "$o"/config-*
            echo '## dtbs'
            (cd "$o/dtbs" && sha256sum ./*.dtb)
            echo '## firmware'
            (cd "$o/firmware" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
            cat "$W/reg/extra-firmware.list"
            echo '## modules'
            (cd "$o/modules" && find . -name '*.ko*' | LC_ALL=C sort)
            echo '## cmdline'
            dd if="$o/boot/KERNEL" bs=1 skip=64 count=512 status=none | sha256sum
            echo '## source'
            sudo make -s -C "$W/reg/linux-${KVER}" ARCH=arm64 distclean
            (cd "$W/reg/linux-${KVER}" && find . -type f \( -name '*.[chS]' -o -name '*.dts*' -o -name 'Kconfig*' -o -name Makefile \) -not -name '.*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum)
          }
          source external-and-mods/kernel-sm8650/soc.env
          for side in base head; do
            if [ "$side" = base ]; then tree=$W/port-base; else tree=$PWD; fi
            if [ -d "$W/reg-base/cache" ]; then sudo mkdir -p "$W/reg" && sudo cp -a "$W/reg-base/cache" "$W/reg/"; fi
            WORK=$W/reg bash "$tree/external-and-mods/kernel-common/build-gcc15.sh" sm8650 2>&1 | tee "$RUNNER_TEMP/reg-$side.log"
            test "${PIPESTATUS[0]}" -eq 0
            n=$(grep -c 'skip missing patch dir' "$RUNNER_TEMP/reg-$side.log" || true)
            test "$n" -eq 0
            grep -m1 '^gcc ' "$RUNNER_TEMP/reg-$side.log" >"$RUNNER_TEMP/gcc-$side.txt"
            manifest >"$RUNNER_TEMP/manifest-$side.txt"
            sudo mv "$W/reg" "$W/reg-$side"
          done
          diff "$RUNNER_TEMP/gcc-base.txt" "$RUNNER_TEMP/gcc-head.txt"
          if ! diff -u "$RUNNER_TEMP/manifest-base.txt" "$RUNNER_TEMP/manifest-head.txt" >"$RUNNER_TEMP/manifest.diff"; then
            { echo '### sm8650 differs between base and head'; echo "changed source hash lines: $(grep -c '^[-+][0-9a-f]\{64\}' "$RUNNER_TEMP/manifest.diff" || true)"; echo '```'; head -n 200 "$RUNNER_TEMP/manifest.diff"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "sm8650 identical at ${BASE_SHA} and ${GITHUB_SHA}" >>"$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kernel-regression-logs
          path: |
            ${{ runner.temp }}/reg-*.log
            ${{ runner.temp }}/*.txt
            ${{ runner.temp }}/manifest.diff
          retention-days: 7

  image:
    needs: kernel
    if: ${{ !cancelled() && (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    outputs:
      v: ${{ steps.pack.outputs.v }}
    steps:
      - name: Check inputs
        run: |
          [[ "$BASE_TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_tag" >&2; exit 1; }
          [[ "$BASE_REPO" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad base_repo" >&2; exit 1; }
          [[ "$KERNEL_RUN_ID" =~ ^[0-9]*$ ]] || { echo "bad kernel_run_id" >&2; exit 1; }
          echo "JOB_START=$(date +%s)" >>"$GITHUB_ENV"
      - uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e
        with:
          remove-codeql: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Base commit
        run: git cat-file -e "${BASE_SHA}^{commit}"
      - name: Host tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends p7zip-full dosfstools uuid-runtime bubblewrap rsync libcap2-bin fdisk python3
          gh --version
          sudo losetup -f
          sudo bwrap --bind / / true
      - name: Reuse guard
        run: |
          paths=(
            external-and-mods/gamescope
            scripts/build-gamescope-in-rootfs.sh
            external-and-mods/MangoHud
            external-and-mods/MangoHud-qualcomm
            scripts/build-mangohud-in-rootfs.sh
            external-and-mods/NetworkManager
            scripts/build-networkmanager-in-rootfs.sh
            external-and-mods/konkr-android
            scripts/build-dpl-lv2-in-rootfs.sh
            scripts/build-kscreen-6.2.5.sh
            scripts/build-kf6-nm-qt-6.14.sh
            scripts/build-plasma-nm-6.2.5.sh
            scripts/build-plasma-keyboard.sh
            scripts/build-kde-gear-26.04.2.sh
            scripts/build-ark-26.04.2.sh
            scripts/build-v4l2-vaapi.sh
            scripts/install-v4l2-vaapi.sh
          )
          changed="$(git diff --name-only "$BASE_SHA" HEAD -- "${paths[@]}")"
          if [ -n "$changed" ]; then
            echo "changed since ${BASE_SHA}, the base image build is stale:" >&2
            echo "$changed" >&2
            exit 1
          fi
      - if: ${{ needs.kernel.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kernel-sm8250
          path: ${{ runner.temp }}/kernel
      - if: ${{ needs.kernel.result == 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kernel-sm8250
          path: ${{ runner.temp }}/kernel
          run-id: ${{ env.KERNEL_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Kernel
        run: |
          mkdir -p "$W/kernel-sm8250/output"
          sudo tar -C "$W/kernel-sm8250/output" -xf "$RUNNER_TEMP/kernel/kernel-sm8250.tar"
          test -s "$W/kernel-sm8250/output/current/boot/KERNEL"
          echo "KREL=$(readlink "$W/kernel-sm8250/output/current")" >>"$GITHUB_ENV"
      - name: Base image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BASE_TAG" in
            v1.3.0)
              sums="ea22c1b48892194ad30fd10f9c6c76fc55705f75d76dc22e470407b1ad3aaebd  steamos-arm-port-sm8650-v1.3.0.7z.001
          b640722117b49bca6498ee2e2be120b007b2ff8f769c0a268e58378343c42042  steamos-arm-port-sm8650-v1.3.0.7z.002
          376a07c7889f25dce2f65d99d4c8ff5707e5d16e0cf85c13964bd380884f7fe2  steamos-arm-port-sm8650-v1.3.0.7z.003" ;;
            *) echo "no pinned part hashes for ${BASE_TAG}" >&2; exit 1 ;;
          esac
          b=$W/base
          mkdir -p "$b"
          gh release download "$BASE_TAG" -R "$BASE_REPO" -p "steamos-arm-port-sm8650-${BASE_TAG}.7z.*" -D "$b"
          (cd "$b" && sha256sum -c <<<"$sums") | tee "$RUNNER_TEMP/base-sums.txt"
          test "$(grep -c ': OK$' "$RUNNER_TEMP/base-sums.txt")" -eq 3
          test "$(find "$b" -maxdepth 1 -name '*.7z.*' | wc -l)" -eq 3
          n=$(7z l -slt "$b/steamos-arm-port-sm8650-${BASE_TAG}.7z.001" | grep -c '^Path = .*\.img$' || true)
          test "$n" -eq 1
          7z x -bd -o"$b" "$b/steamos-arm-port-sm8650-${BASE_TAG}.7z.001" >/dev/null
          rm -f "$b"/*.7z.*
          img=$(find "$b" -maxdepth 1 -name '*.img')
          test -f "$img"
          echo "BASE_IMG=$img" >>"$GITHUB_ENV"
      - name: Base image preflight
        run: |
          m=$W/basemnt
          dev=$(sudo losetup -r -f --show -P "$BASE_IMG")
          trap 'sudo umount "$m" 2>/dev/null || true; sudo losetup -d "$dev"' EXIT
          for _ in $(seq 1 50); do [ -b "${dev}p2" ] && break; sleep 0.1; done
          sudo mkdir -p "$m"
          sudo mount -o ro "${dev}p2" "$m"
          grep -qx 'soc=sm8650' "$m/opt/steamos-sm8650/IMAGE.txt"
          for t in gcc cmake ninja; do test -x "$m/usr/bin/$t" || { echo "base rootfs has no $t" >&2; exit 1; }; done
          compgen -G "$m/usr/lib/libgallium-*.so" >/dev/null || { echo "base rootfs has no Mesa in /usr/lib" >&2; exit 1; }
          compgen -G "$m/opt/stock-steamos/usr/lib/libgallium-*.so" >/dev/null || { echo "base rootfs has no Valve Mesa in /opt/stock-steamos" >&2; exit 1; }
          mesa=$(grep -a -o -h -m1 'Mesa [0-9][0-9.]*' "$m"/usr/lib/libgallium-*.so | head -n 1)
          valve=$(grep -a -o -h -m1 'Mesa [0-9][0-9.]*' "$m"/opt/stock-steamos/usr/lib/libgallium-*.so | head -n 1)
          { echo "base Mesa: $mesa"; echo "base Valve Mesa: $valve"; } >>"$GITHUB_STEP_SUMMARY"
          [[ "$mesa" == "Mesa 26.2.3" ]] || { echo "base Mesa is $mesa, not 26.2.3" >&2; exit 1; }
          [[ "$valve" == "Mesa 26.3"* ]] || { echo "base Valve Mesa is $valve, not 26.3" >&2; exit 1; }
          test -f "$m/usr/lib/environment.d/60-sm8550-zink.conf" || { echo "base rootfs has no zink env" >&2; exit 1; }
          sudo bash -c 'cd "$1" && sha256sum usr/bin/mangoapp usr/bin/NetworkManager usr/lib/NetworkManager/*/libnm-device-plugin-wifi.so' _ "$m" | tee "$RUNNER_TEMP/base-builds.sha256"
          test "$(wc -l <"$RUNNER_TEMP/base-builds.sha256")" -eq 3
      - name: Build image
        run: |
          quiet=1
          [ "$VERBOSE" = 1 ] && quiet=0
          sudo -E env STEAMOS_WORK="$W" STEAMOS_ROOTFS="$W/rootfs-sm8250" SOC=sm8250 \
            KERNEL_OUT="$W/kernel-sm8250/output/current" CMDLINE_QUIET="$quiet" \
            TEST_KERNEL_OUT="$W/kernel-sm8250/output/current" TEST_KERNEL_NAME=KERNEL-cpuidle-off \
            TEST_KERNEL_CMDLINE_EXTRA=cpuidle.off=1 BOX64_SRC="$W/box64" \
            ./make-steamos-sm8650.sh --from-img "$BASE_IMG" --img "$W/steamos-sm8250.img" 2>&1 | tee "$RUNNER_TEMP/img8250.log"
          test "${PIPESTATUS[0]}" -eq 0
          sudo rm -f "$BASE_IMG"
      - name: Check build log and rootfs
        run: |
          L=$RUNNER_TEMP/img8250.log
          R=$W/rootfs-sm8250
          mapfile -t c < <(grep 'KERNEL cmdline:' "$L")
          test "${#c[@]}" -eq 2
          [[ "${c[1]}" == *" cpuidle.off=1" ]]
          grep -qF '==> cmake Box64 (SD865)' "$L"
          grep -qF "== Mesa: keeping the rootfs stack, Valve's in /opt/stock-steamos" "$L"
          sudo grep -qx 'MESA_LOADER_DRIVER_OVERRIDE=zink' "$R/usr/lib/environment.d/60-sm8550-zink.conf"
          sudo test ! -e "$R/usr/lib/steamos-sm8650/frame-turnip"
          sudo test ! -e "$R/usr/share/steamos-sm8650/frame-turnip_icd.aarch64.json"
          mesa=$(sudo grep -a -o -h -m1 'Mesa [0-9][0-9.]*' "$R"/usr/lib/libgallium-*.so | head -n 1)
          test "$mesa" = 'Mesa 26.2.3'
          grep -qx 'SD865:BOOL=ON' /tmp/box64-build-frame/CMakeCache.txt
          test "$(sudo cat "$R/usr/local/share/box64-target")" = SD865
          ref=$(grep -oE '[0-9a-f]{40}' <(grep '^REF=' scripts/build-box64-in-rootfs.sh))
          test -n "$ref"
          test "$(sudo git -c safe.directory='*' -C "$W/box64" rev-parse HEAD)" = "$ref"
          sudo ls "$R/usr/lib/binfmt.d/box64.conf" "$R/etc/binfmt.d/box64.conf"
          test "$(sudo strings "$R/usr/bin/mangoapp" | grep -c 'GLIBC_2\.43' || true)" = 0
          sudo bash -c 'cd "$1" && sha256sum -c --quiet "$2"' _ "$R" "$RUNNER_TEMP/base-builds.sha256"
          grep -qF 'konkr-android: no payload in' "$L"
          sudo test -s "$R/usr/share/konkr-android/common/system/product/priv-app/Phonesky/Phonesky.apk"
          sudo test -f "$R/usr/lib/lv2/dpl.lv2/dpl.so"
          sudo test -f "$R/usr/lib/dri/msm_drv_video.so"
          sudo test -f "$R/usr/lib/qt6/plugins/plasma/kcms/systemsettings/kcm_kscreen.so"
          sudo test -f "$R/usr/lib/qt6/plugins/plasma/kcms/systemsettings_qwidgets/kcm_networkmanagement.so"
          sudo test -x "$R/usr/bin/plasma-keyboard"
          if grep -E '^== (official |KF6 NetworkManagerQt|plasma-keyboard )' "$L"; then echo "a KDE build the base image carries ran again" >&2; exit 1; fi
          test "$(sudo ls "$R/usr/lib/modules")" = "$KREL"
          source external-and-mods/kernel-sm8250/soc.env
          n=0
          for ent in $BUILTIN_FW; do
            sha=${ent##*:}
            dst=${ent#*:}
            dst=${dst%:*}
            echo "$sha  $R/usr/lib/firmware/$dst" | sudo sha256sum -c --quiet
            n=$((n + 1))
          done
          test "$n" -eq 9
          STEAMOS_WORK=$W bash scripts/stage-rocknix-abl.sh "$RUNNER_TEMP/abl-sm8650" sm8650
      - name: UCM includes in the rootfs
        run: |
          R="$W/rootfs-sm8250"
          sudo ls -d "$R"/usr/share/alsa/ucm2/codecs/{wcd938x,wsa881x,qcom-lpass/rx-macro,qcom-lpass/tx-macro,qcom-lpass/wsa-macro} "$R"/usr/share/alsa/ucm2/lib/{card-init,ctl-remap}.conf
          u="$R"/usr/share/alsa/ucm2
          for f in codecs/wcd938x/init.conf codecs/wcd938x/HeadphoneDisableSeq.conf \
                   codecs/wcd938x/HeadphoneMicEnableSeq.conf codecs/wcd938x/HeadphoneMicDisableSeq.conf \
                   codecs/wsa881x/init.conf codecs/wsa881x/SpeakerDisableSeq.conf \
                   codecs/qcom-lpass/rx-macro/init.conf codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf \
                   codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf \
                   codecs/qcom-lpass/wsa-macro/SpeakerDisableSeq.conf lib/card-init.conf lib/ctl-remap.conf; do
            sudo test -s "$u/$f" || { echo "missing UCM include $f"; exit 1; }
          done
          sudo grep -q 'File "/AYANEO/PocketMICRO2/HiFi.conf"' "$u"/conf.d/sm8250/PocketMICRO2.conf
      - name: Pocket MICRO 2 overlay files in the rootfs
        run: |
          R="$W/rootfs-sm8250"
          sudo find "$R"/usr/share/alsa/ucm2/AYANEO/PocketMICRO2 \
            "$R"/usr/share/inputplumber/capability_maps/ayaneo_pocket_micro2_deck.yaml \
            "$R"/usr/share/inputplumber/capability_maps/ayaneo_pocket_micro2_keys.yaml \
            "$R"/var/lib/overlays/etc/upper/inputplumber/devices.d/04-ayaneo-pocket-micro2.yaml \
            "$R"/usr/lib/udev/rules.d/99-sm8250-wcd938x-nosleep.rules \
            "$R"/usr/lib/udev/rules.d/99-ayaneo-pocket-micro2-dp-audio.rules \
            "$R"/usr/lib/systemd/user/steamos-arm-pm2-audio-state.service \
            "$R"/usr/lib/systemd/user/wireplumber.service.wants/steamos-arm-pm2-audio-state.service \
            "$R"/usr/share/wireplumber/wireplumber.conf.d/52-ayaneo-pocket-micro2.conf \
            "$R"/usr/share/wireplumber/wireplumber.conf.d/50-steamos-arm-default-sink.conf \
            "$R"/usr/share/wireplumber/scripts/steamos-arm/default-sink-rank.lua \
            "$R"/usr/share/steamos-manager/devices/ayaneo-pocket-micro2.toml
          for f in pm2-dp-audio-reprobe pm2-audio-state-reset; do
            sudo test -x "$R/usr/lib/steamos-arm/$f" || { echo "$f is not executable"; exit 1; }
          done
          for t in amixer aplay flock udevadm journalctl systemd-run logger timeout; do
            sudo test -x "$R/usr/bin/$t" || { echo "rootfs has no $t"; exit 1; }
          done
          sudo grep -q 'REDMAGIC|PocketMICRO2' "$R"/usr/lib/steamos/sm8550-audio-setup
          sudo grep -q '"REDMAGIC 6|AYANEO Pocket MICRO 2" /sys' "$R"/usr/lib/steamos/sm8550-audio-pipewire
          sudo grep -q '"KONKR Pocket FIT|AYANEO Pocket S2" /sys' "$R"/usr/lib/steamos/sm8550-audio-pipewire
      - name: PM2 udev rules verify
        run: |
          for f in 99-sm8250-wcd938x-nosleep.rules 99-ayaneo-pocket-micro2-dp-audio.rules; do
            sudo udevadm verify "$W/rootfs-sm8250/usr/lib/udev/rules.d/$f"
          done
      - name: Audio watcher exits on the PM2
        run: |
          m=$(mktemp)
          sed "s#/sys/firmware/devicetree/base/model#$m#g" steamos-overlay/usr/lib/steamos/sm8550-audio-pipewire >"$RUNNER_TEMP/w"
          printf 'AYANEO Pocket MICRO 2\0' >"$m"
          out=$(timeout 5 bash "$RUNNER_TEMP/w" --watch 2>&1)
          test -z "$out"
          printf 'AYANEO Pocket S2\0' >"$m"
          rc=0
          timeout 5 bash "$RUNNER_TEMP/w" --watch >/dev/null 2>&1 || rc=$?
          test "$rc" -eq 124
      - name: No upstream InputPlumber profile for the PM2
        run: |
          R="$W/rootfs-sm8250"
          mapfile -t hits < <(sudo grep -l 0428 "$R"/usr/share/inputplumber/devices/*.yaml || true)
          echo "0428 profiles: ${hits[*]:-none}"
          if [ "${#hits[@]}" -gt 0 ] && sudo grep -l -e 'AYANEO Pocket MICRO 2' -e 'ayaneo,pocket-micro2' "${hits[@]}"; then
            echo "upstream profile also matches the PM2"; exit 1
          fi
      - name: REDMAGIC sed still matches
        run: |
          cp steamos-overlay/usr/lib/steamos/sm8550-audio-pipewire /tmp/p
          sed -i 's/|AYANEO Pocket S2" \/sys/|AYANEO Pocket S2|REDMAGIC 6" \/sys/' /tmp/p
          test "$(grep -c 'AYANEO Pocket S2|REDMAGIC 6" /sys' /tmp/p)" = 1
      - name: bash -n on the audio and overlay scripts
        run: |
          for f in scripts/apply-overlays.sh scripts/apply-overlays-sm8350.sh \
                   sm8650-overlay/usr/lib/steamos/sm8550-audio-setup steamos-overlay/usr/lib/steamos/sm8550-audio-pipewire \
                   sm8250-overlay/usr/lib/steamos-arm/pm2-dp-audio-reprobe sm8250-overlay/usr/lib/steamos-arm/pm2-audio-state-reset; do
            bash -n "$f"
          done
      - name: Hub catalog and Python
        run: |
          c=steamos-overlay/usr/lib/steamos-arm/hub/catalog.json
          test "$(python3 -c 'import json,sys; print(" ".join(sorted(a["id"] for a in json.load(open(sys.argv[1]))["apps"] if a.get("starter") == "sm8250")))' "$c")" = "azahar duckstation esde melonds ppsspp retroarch"
          test "$(grep -c '"starter": "sm8350"' "$c")" = 0
          python3 -m json.tool "$c" >/dev/null
          python3 -m py_compile steamos-overlay/usr/lib/steamos-arm/hub/hub.py steamos-overlay/usr/lib/steamos-arm/power_limits.py
          node --check external-and-mods/Decky/common/loadout/dist/index.js
      - name: Update tools list sm8250
        run: |
          python3 -m py_compile external-and-mods/konkr-update/konkr-update.py
          python3 scripts/build-update-package.py --help | grep -q sm8250
          python3 scripts/build-update-v2.py --help | grep -q sm8250
      - name: Check image
        run: |
          m=$W/newmnt
          dev=$(sudo losetup -r -f --show -P "$W/steamos-sm8250.img")
          trap 'sudo umount "$m/boot" "$m/root" 2>/dev/null || true; sudo losetup -d "$dev"' EXIT
          for _ in $(seq 1 50); do [ -b "${dev}p2" ] && break; sleep 0.1; done
          sudo mkdir -p "$m/boot" "$m/root"
          sudo mount -o ro "${dev}p1" "$m/boot"
          sudo mount -o ro "${dev}p2" "$m/root"
          for f in KERNEL KERNEL.md5 KERNEL-cpuidle-off rocknix_abl/SM8250/abl_signed-SM8250.elf \
                   rocknix_abl/SM8250/abl_signed-SM8250.elf.sha256 rocknix_abl/SM8250/flash_abl.sh; do
            sudo test -s "$m/boot/$f" || { echo "BOOT has no $f" >&2; exit 1; }
          done
          r=$m/root
          sudo grep -qx 'soc=sm8250' "$r/opt/steamos-sm8650/IMAGE.txt"
          sudo grep -qx 'soc=sm8650' "$r/opt/steamos-sm8650/RELEASE-BASE.txt"
          test "$(sudo ls "$r/usr/lib/modules")" = "$KREL"
          for f in qcom/a650_sqe.fw qcom/sm8250/adsp.mbn ath11k/QCA6390/hw2.0/amss.bin; do
            sudo test -s "$r/usr/lib/firmware/$f" || { echo "root has no firmware $f" >&2; exit 1; }
          done
      - id: pack
        name: Pack
        run: |
          v=$(date -u +%Y%m%d).$(git rev-parse --short HEAD)
          mkdir -p "$W/out"
          7z a -bd -mx=5 -v1992294400b "$W/out/steamos-arm-port-sm8250-$v.7z" "$W/steamos-sm8250.img" >/dev/null
          sudo rm -f "$W/steamos-sm8250.img"
          (cd "$W/out" && sha256sum steamos-arm-port-sm8250-"$v".7z.* >SHA256SUMS)
          cat "$W/out/SHA256SUMS" >>"$GITHUB_STEP_SUMMARY"
          echo "v=$v" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: steamos-sm8250-${{ steps.pack.outputs.v }}
          path: ${{ env.W }}/out/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: steamos-sm8250-log
          path: ${{ runner.temp }}/img8250.log
          retention-days: 3
      - if: ${{ !cancelled() }}
        name: Disk and time
        run: |
          { echo '### Disk'; echo '```'; df -h /; echo '```'; echo "Job time: $(( ($(date +%s) - JOB_START) / 60 )) min"; } >>"$GITHUB_STEP_SUMMARY"

  release:
    needs: [image, kernel-regression]
    if: ${{ !cancelled() && needs.image.result == 'success' && (needs.kernel-regression.result == 'success' || needs.kernel-regression.result == 'skipped') && (inputs.draft_release || github.ref == 'refs/heads/pm2-draft') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: steamos-sm8250-${{ needs.image.outputs.v }}
          path: ${{ env.W }}/out
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.image.outputs.v }}
        run: gh release create "sm8250-$V" --draft --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --title "Pocket MICRO 2 test $V" "$W"/out/*
